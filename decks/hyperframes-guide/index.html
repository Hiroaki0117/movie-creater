<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HyperFrames 入門</title>
    <meta name="description" content="コンポジションの構造、data-* によるタイミング指定、GSAP タイムライン、決定論ルール、CLI の開発フローまで。実装者がそのまま手を動かせる粒度で解説します。" />
    <link rel="icon" href="data:," />
    <script>
      // 聴衆用タブはタイトルを変えて、タブ選択時に見分けられるようにする
      if (new URLSearchParams(location.search).get("mode") === "audience") {
        document.title = "HyperFrames 入門 — Audience";
      }
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: #0b0e14;
        overflow: hidden;
      }
      hyperframes-slideshow {
        display: block;
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      hyperframes-player {
        position: absolute;
        inset: 0;
      }

      /* 一覧へ戻る導線。発表中は邪魔なので、
         聴衆モードと全画面では消す。 */
      .back {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 50;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 16px;
        border-radius: 999px;
        border: 1px solid rgba(232, 237, 245, 0.18);
        background: rgba(11, 14, 20, 0.72);
        backdrop-filter: blur(8px);
        color: #9aa7bb;
        font: 500 13px/1 system-ui, sans-serif;
        text-decoration: none;
        opacity: 0.42;
        transition:
          opacity 0.18s ease,
          color 0.18s ease,
          border-color 0.18s ease;
      }
      .back:hover,
      .back:focus-visible {
        opacity: 1;
        color: #e8edf5;
        border-color: rgba(79, 214, 192, 0.6);
      }
      body[data-audience="true"] .back,
      body[data-fullscreen="true"] .back {
        display: none;
      }
    </style>
    <script src="/vendor/player.js"></script>
    <script src="/vendor/slideshow.js"></script>
  </head>
  <body>
    <a class="back" href="/" aria-label="スライド一覧に戻る">← 一覧</a>

    <hyperframes-slideshow tabindex="0">
      <hyperframes-player interactive src="/composition/index.html"></hyperframes-player>

      <!--
        島（スライド定義）は /composition/index.html からビルド時に複製されたものです。
        直接編集しないでください — コンポジション側を直して `npm run build` を実行します。
        <hyperframes-slideshow> は自分の innerHTML から島を読むため、この複製が必要です。
      -->
      <script type="application/hyperframes-slideshow+json">
{
        "slides": [
          {
            "sceneId": "hook",
            "notes": "掴み。HyperFrames は動画編集ソフトではなく、HTML を入力とするレンダリングエンジンだと最初に言い切る。"
          },
          {
            "sceneId": "install",
            "notes": "前提は Node 22+ と FFmpeg の2つだけ。FFmpeg を入れ忘れると render だけが落ちる、と補足する。",
            "fragments": [8.3, 8.6, 8.9]
          },
          {
            "sceneId": "anatomy",
            "notes": "ルートの data-duration が出力の尺を決める。クリップは class=\"clip\" が必須 — これが無いと表示制御が効かない。"
          },
          {
            "sceneId": "timing",
            "notes": "この3属性がスライドの核心。data-start と data-duration は秒、track-index は重なり順。1つずつ出す。",
            "fragments": [30.3, 30.6, 30.9]
          },
          {
            "sceneId": "tracks",
            "notes": "同じトラックで時間が重なると z-index の解決が必要になる。番号が大きいほど手前。"
          },
          {
            "sceneId": "gsap",
            "notes": "paused であること、同期的に作ること、__timelines のキーが root であること。この3点を強調。",
            "fragments": [54.3, 54.6]
          },
          {
            "sceneId": "determinism",
            "notes": "ここは一番よく事故る。なぜダメかを聞かれたら右下のホットスポットから分岐する。",
            "fragments": [66.3, 66.6, 66.9],
            "hotspots": [
              {
                "id": "why-determinism",
                "label": "なぜ時計や乱数が使えないのか？",
                "target": "determinism-detail",
                "region": { "x": 60, "y": 78, "w": 34, "h": 13 }
              }
            ]
          },
          {
            "sceneId": "cli",
            "notes": "check は lint + runtime + layout + motion + contrast をまとめて走らせる。render はユーザー承認の後。",
            "fragments": [80.3, 80.6, 80.9, 81.2]
          },
          {
            "sceneId": "close",
            "notes": "このデッキ自体が composition/index.html 1枚。ソースを開いて見せると効く。"
          }
        ],
        "slideSequences": [
          {
            "id": "determinism-detail",
            "label": "決定論ルールの詳細",
            "slides": [
              {
                "sceneId": "det-why",
                "notes": "「再生」ではなく「seek」。フレームは順番通りに来るとは限らない。"
              },
              {
                "sceneId": "det-fix",
                "notes": "無限ループは有限回に落とす。floor を使う — ceil だと data-duration を超えて lint に引っかかる。"
              }
            ]
          }
        ]
      }
      </script>
    </hyperframes-slideshow>

    <script>
      (function () {
        var isAudience = new URLSearchParams(location.search).get("mode") === "audience";
        document.body.dataset.audience = String(isAudience);

        function syncFullscreen() {
          document.body.dataset.fullscreen = String(Boolean(document.fullscreenElement));
        }
        document.addEventListener("fullscreenchange", syncFullscreen);
        syncFullscreen();

        // ← / → を確実に拾えるよう、読み込み後にデッキへフォーカスを渡す。
        // 戻るリンクは Tab で到達できるままにしておく。
        var deck = document.querySelector("hyperframes-slideshow");
        if (deck) requestAnimationFrame(function () { deck.focus(); });
      })();
    </script>
  </body>
</html>
