<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="theme-color" content="#08090c" />
    <link rel="icon" href="data:," />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #08090c;
        --fg: #edf0f5;
        --fg-2: #a2acbd;
        --fg-3: #626d7e;
        --rule: rgba(237, 240, 245, 0.11);
        --surface: rgba(237, 240, 245, 0.028);
        --accent: {{ACCENT}};
        --sans:
          system-ui, -apple-system, "Segoe UI Variable Text", "Yu Gothic UI", "Yu Gothic",
          "Hiragino Sans", Meiryo, sans-serif;
        --mono: ui-monospace, "SF Mono", Consolas, "Roboto Mono", monospace;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      body {
        min-height: 100dvh;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--sans);
        line-height: 1.75;
        -webkit-font-smoothing: antialiased;
      }
      .shell {
        max-width: 1120px;
        margin: 0 auto;
        padding: clamp(28px, 5vw, 48px) clamp(22px, 5vw, 56px) clamp(56px, 8vw, 84px);
      }
      .back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fg-3);
        text-decoration: none;
        transition: color 0.25s var(--ease);
      }
      .back:hover,
      .back:focus-visible {
        color: var(--fg);
      }
      h1 {
        margin-top: 26px;
        font-size: clamp(26px, 4vw, 40px);
        font-weight: 700;
        line-height: 1.28;
        letter-spacing: -0.008em;
      }
      .sub {
        margin-top: 6px;
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .player {
        margin-top: clamp(24px, 3.5vw, 36px);
        border: 1px solid var(--rule);
        border-radius: 14px;
        overflow: hidden;
        background: #000;
        line-height: 0;
      }
      video {
        display: block;
        width: 100%;
        height: auto;
      }
      .note {
        margin-top: 18px;
        font-size: 13.5px;
        color: var(--fg-3);
      }
      .desc {
        margin-top: 26px;
        max-width: 62ch;
        color: var(--fg-2);
        font-size: 15px;
      }
      dl.stats {
        margin-top: 30px;
        padding-top: 22px;
        border-top: 1px solid var(--rule);
        display: flex;
        flex-wrap: wrap;
        gap: 12px 40px;
      }
      dl.stats dt {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--fg-3);
      }
      dl.stats dd {
        margin-top: 3px;
        font-family: var(--mono);
        font-size: 18px;
        color: var(--fg);
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <a class="back" href="/">← 一覧</a>
      <p class="sub">{{SUBTITLE}}</p>
      <h1>{{TITLE}}</h1>

      <div class="player">
        <video controls muted playsinline preload="metadata" poster="{{POSTER}}">
          <source src="{{SRC}}" type="video/mp4" />
        </video>
      </div>
      <p class="note">{{NOTE}}</p>

      <p class="desc">{{DESCRIPTION}}</p>

      <dl class="stats">{{STATS}}</dl>
    </main>
  </body>
</html>
