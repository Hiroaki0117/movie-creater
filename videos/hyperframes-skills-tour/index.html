<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FAF9F5;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="89"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="6.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-entry"
        class="scene"
        data-composition-id="02-entry"
        data-composition-src="compositions/frames/02-entry.html"

      <div

      <div

      ></div>

      <div
        id="el-05-build"

        id="el-10-close"
        class="scene"
        data-composition-id="10-close"
        data-composition-src="compositions/frames/10-close.html"
        data-start="81"
        data-duration="8"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 6);
        tl.fromTo("#el-02-entry", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 6);
        tl.to("#el-02-entry", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 13);
        tl.fromTo("#el-03-brief", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 13);
        tl.to("#el-03-brief", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 23);
        tl.fromTo("#el-04-route", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 23);
        tl.to("#el-04-route", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 33);
        tl.fromTo("#el-05-build", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 33);
        tl.to("#el-05-build", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 42);
        tl.fromTo("#el-06-check", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 42);
        tl.to("#el-07-render", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 57);
        tl.fromTo("#el-08-catalog-a", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 57);
        tl.to("#el-09-catalog-b", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 81);
        tl.fromTo("#el-10-close", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 81);
        tl.to({}, { duration: 89 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
